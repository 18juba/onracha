name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_DB: onracha
          POSTGRES_USER: onracha
          POSTGRES_PASSWORD: onracha_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onracha -d onracha"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgres://onracha:onracha_ci_only@localhost:5432/onracha?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: go mod download

      - name: Install migration CLI
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.20.1

      - name: Apply database migrations
        run: |
          "$(go env GOPATH)/bin/migrate" -path ./migrations -database "$DATABASE_URL" up

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These Go files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Lint
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Enforce domain coverage
        run: |
          go test ./internal/auth/... -coverprofile=/tmp/auth-coverage.out
          go test ./internal/arena/... -coverprofile=/tmp/arena-coverage.out
          go test ./internal/game/... -coverprofile=/tmp/game-coverage.out
          auth_coverage="$(go tool cover -func=/tmp/auth-coverage.out | awk '$1 == "total:" { gsub("%", "", $3); print $3 }')"
          arena_coverage="$(go tool cover -func=/tmp/arena-coverage.out | awk '$1 == "total:" { gsub("%", "", $3); print $3 }')"
          game_coverage="$(go tool cover -func=/tmp/game-coverage.out | awk '$1 == "total:" { gsub("%", "", $3); print $3 }')"
          echo "Auth domain coverage: $auth_coverage% (minimum: 80%)"
          echo "Arena domain coverage: $arena_coverage% (minimum: 80%)"
          echo "Game domain coverage: $game_coverage% (minimum: 80%)"
          awk -v auth="$auth_coverage" -v arena="$arena_coverage" -v game="$game_coverage" 'BEGIN { exit !(auth >= 80 && arena >= 80 && game >= 80) }'

      - name: Build
        run: |
          go build ./...
          go build -o /tmp/onracha-api .

      - name: Set up k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: '2.3.0'

      - name: Smoke test organizer-to-player flow
        env:
          BASE_URL: http://127.0.0.1:8080
          PHOTO_STORAGE_DIR: /tmp/onracha-smoke-uploads
        run: |
          set -euo pipefail
          /tmp/onracha-api > /tmp/onracha-api.log 2>&1 &
          api_pid=$!
          cleanup() {
            kill "$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          api_ready=false
          for _ in $(seq 1 30); do
            if curl --fail --silent "$BASE_URL/health" >/dev/null; then
              api_ready=true
              break
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat /tmp/onracha-api.log
              exit 1
            fi
            sleep 1
          done
          if [ "$api_ready" != "true" ]; then
            echo "API did not become ready within 30 seconds." >&2
            cat /tmp/onracha-api.log
            exit 1
          fi

          k6 run ../performance/smoke.js

  frontend:
    name: Frontend (SvelteKit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Svelte and TypeScript
        run: bun run check

      - name: Lint and format
        run: bun run lint

      - name: Test
        run: bun run test:unit --run

      - name: Build
        run: bun run build


name: onracha

services:
  backend:
    image: golang:1.27.3-alpine
    working_dir: /app
    command: go run .
    volumes:
      - ./backend:/app
    ports:
      - "8080:8080"

  frontend:
    image: oven/bun:1.4.4
    working_dir: /app
    command: sh -c "bun install --frozen-lockfile && bun run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"

volumes:
  frontend_node_modules:
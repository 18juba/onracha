name: onracha

services:
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-onracha}
      POSTGRES_USER: ${POSTGRES_USER:-onracha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onracha}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  migrate:
    image: migrate/migrate:v4.20.1
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER:-onracha}:${POSTGRES_PASSWORD:-onracha}@db:5432/${POSTGRES_DB:-onracha}?sslmode=disable"
      - up
    volumes:
      - ./backend/migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy

  backend:
    image: golang:1.27.3-alpine
    working_dir: /app
    command: go run .
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-onracha}:${POSTGRES_PASSWORD:-onracha}@db:5432/${POSTGRES_DB:-onracha}?sslmode=disable
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      SESSION_COOKIE_SECURE: "false"
      OPENAPI_SPEC_PATH: /docs/openapi.yaml
    volumes:
      - ./backend:/app
      - ./docs:/docs:ro
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    image: oven/bun:1.4.4
    working_dir: /app
    command: sh -c "bun install --frozen-lockfile && bun run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"

volumes:
  frontend_node_modules:
  postgres_data:

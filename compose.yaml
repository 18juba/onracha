name: onracha

services:
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-onracha}
      POSTGRES_USER: ${POSTGRES_USER:-onracha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onracha}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  backend:
    image: golang:1.27.3-alpine
    working_dir: /app
    command: go run .
    volumes:
      - ./backend:/app
    ports:
      - "8080:8080"

  frontend:
    image: oven/bun:1.4.4
    working_dir: /app
    command: sh -c "bun install --frozen-lockfile && bun run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"

volumes:
  frontend_node_modules:
  postgres_data:

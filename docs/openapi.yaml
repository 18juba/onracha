openapi: 3.1.0
info:
  title: ONRACHA API
  version: 0.1.0
  description: API inicial do ONRACHA com cadastro e autenticação de contas.
servers:
  - url: http://localhost:8080
    description: Ambiente local via Docker Compose
paths:
  /health:
    get:
      summary: Verifica se a API está respondendo
      operationId: healthCheck
      responses:
        '200':
          description: API disponível
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /api/v1/auth/register:
    post:
      summary: Cria uma conta
      operationId: registerAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  minLength: 1
                  example: Lucas Oliveira
                email:
                  type: string
                  format: email
                  maxLength: 254
                  example: lucas@example.com
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                  description: Senha em forma de frase; espaços e caracteres Unicode são aceitos.
      responses:
        '201':
          description: Conta criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email já cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/login:
    post:
      summary: Inicia uma sessão
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: lucas@example.com
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
      responses:
        '200':
          description: Sessão iniciada; token retornado em cookie HttpOnly
          headers:
            Set-Cookie:
              description: Cookie de sessão com validade de 24 horas.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Corpo JSON inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Email ou senha inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/logout:
    post:
      summary: Encerra a sessão atual
      operationId: logout
      security:
        - cookieAuth: []
      responses:
        '204':
          description: Sessão revogada e cookie de sessão expirado
          headers:
            Set-Cookie:
              description: Expira o cookie HttpOnly da sessão atual.
              schema:
                type: string
        '500':
          description: Erro interno ao revogar a sessão
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/me:
    get:
      summary: Retorna a conta da sessão atual
      operationId: currentAccount
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Conta autenticada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Sessão ausente, inválida ou expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/arenas:
    get:
      summary: Lista as arenas da conta autenticada
      operationId: listArenas
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Arenas da conta, ordenadas da mais recente para a mais antiga
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Arena'
        '401':
          description: Sessão ausente, inválida ou expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Cadastra uma arena para a conta autenticada
      operationId: createArena
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, arena_type, address, city, state]
              properties:
                name:
                  type: string
                  minLength: 1
                  example: Arena Central
                arena_type:
                  type: string
                  minLength: 1
                  description: Tipo é normalizado para letras minúsculas.
                  example: society
                address:
                  type: string
                  minLength: 1
                  example: Rua do Esporte, 100
                city:
                  type: string
                  minLength: 1
                  example: São Paulo
                state:
                  type: string
                  minLength: 2
                  maxLength: 2
                  pattern: '^[A-Za-z]{2}$'
                  description: Sigla da UF; a API normaliza o valor para maiúsculas.
                  example: SP
                latitude:
                  type: number
                  format: double
                  minimum: -90
                  maximum: 90
                  nullable: true
                  description: Latitude geográfica. Deve ser enviada junto com longitude.
                  example: -23.55052
                longitude:
                  type: number
                  format: double
                  minimum: -180
                  maximum: 180
                  nullable: true
                  description: Longitude geográfica. Deve ser enviada junto com latitude.
                  example: -46.633308
      responses:
        '201':
          description: Arena cadastrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Arena'
        '400':
          description: Dados inválidos ou campo não permitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Sessão ausente, inválida ou expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/arenas/discover:
    get:
      summary: Busca arenas ativas para explorar, mesmo sem jogos agendados
      operationId: discoverArenas
      description: >-
        Informe uma cidade ou latitude e longitude em conjunto; os filtros podem ser combinados. A busca por distância
        usa 25 km por padrão. radius_km pode ser informado acima de 0 e até 100. A resposta contém somente dados públicos da arena.
      security:
        - cookieAuth: []
      parameters:
        - name: city
          in: query
          required: false
          schema:
            type: string
          description: Filtra por nome da cidade, sem diferenciar maiúsculas e minúsculas.
        - name: latitude
          in: query
          required: false
          schema:
            type: number
            minimum: -90
            maximum: 90
          description: Latitude do ponto central; deve ser usada junto de longitude.
        - name: longitude
          in: query
          required: false
          schema:
            type: number
            minimum: -180
            maximum: 180
          description: Longitude do ponto central; deve ser usada junto de latitude.
        - name: radius_km
          in: query
          required: false
          schema:
            type: number
            exclusiveMinimum: 0
            maximum: 100
            default: 25
          description: Raio da busca em quilômetros; só pode ser usado com latitude e longitude.
      responses:
        '200':
          description: Arenas ativas que correspondem aos filtros, sem depender de jogos agendados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DiscoveredArena'
        '400':
          description: Cidade ou filtros de localização ausentes ou inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Sessão ausente, inválida ou expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/arenas/{id}:
    get:
      summary: Retorna os dados de uma arena da conta autenticada
      operationId: getArena
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Arena encontrada e pertencente à conta autenticada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Arena'
        '400':
          description: Identificador inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Sessão ausente, inválida ou expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Arena inexistente ou pertencente a outra conta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Substitui os dados editáveis de uma arena
      operationId: updateArena
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, arena_type, address, city, state, active]
              properties:
                name:
                  type: string
                  minLength: 1
                arena_type:
                  type: string
                  minLength: 1
                address:
                  type: string
                  minLength: 1
                city:
                  type: string
                  minLength: 1
                state:
                  type: string
                  minLength: 2
                  maxLength: 2
                  pattern: '^[A-Za-z]{2}$'
                active:
                  type: boolean
                latitude:
                  type: number
                  format: double
                  minimum: -90
                  maximum: 90
                  nullable: true
                  description: Latitude geográfica. Deve ser enviada junto com longitude.
                  example: -23.55052
                longitude:
                  type: number
                  format: double
                  minimum: -180
                  maximum: 180
                  nullable: true
                  description: Longitude geográfica. Deve ser enviada junto com latitude.
                  example: -46.633308
      responses:
        '200':
          description: Arena atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Arena'
        '400':
          description: Dados incompletos ou inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Sessão ausente, inválida ou expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Arena inexistente ou pertencente a outra conta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/arenas/{id}/active:
    patch:
      summary: Alterna entre ativa e inativa a arena da conta autenticada
      operationId: toggleArenaActive
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Estado de atividade alternado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Arena'
        '400':
          description: Identificador inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Sessão ausente, inválida ou expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Arena inexistente ou pertencente a outra conta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/arenas/{id}/photo:
    put:
      summary: Envia ou substitui a foto da arena da conta autenticada
      operationId: replaceArenaPhoto
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Arquivo JPEG ou PNG válido de até 5 MiB.
      responses:
        '200':
          description: Arena atualizada com a referência pública da foto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Arena'
        '400':
          description: Multipart inválido ou arquivo que não é uma imagem JPEG/PNG válida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Sessão ausente, inválida ou expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Arena inexistente ou pertencente a outra conta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Imagem maior que 5 MiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno ao salvar a imagem ou atualizar a referência
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/arenas/{id}/time-slots:
    get:
      summary: Lista horários futuros disponíveis em uma arena
      operationId: listAvailableTimeSlots
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Horários futuros sem jogo agendado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimeSlot'
        '400':
          description: Identificador inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Sessão ausente, inválida ou expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Cadastra ou reabre um horário na arena
      description: Se já existir um horário encerrado com o mesmo início e fim, reabre esse registro. Uma sobreposição gera conflito somente com outro horário aberto.
      operationId: createArenaTimeSlot
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [starts_at, ends_at]
              properties:
                starts_at:
                  type: string
                  format: date-time
                  example: '2026-12-12T19:00:00-03:00'
                ends_at:
                  type: string
                  format: date-time
                  example: '2026-12-12T20:00:00-03:00'
      responses:
        '201':
          description: Horário cadastrado ou reaberto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeSlot'
        '400':
          description: Intervalo inválido ou no passado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Sessão ausente, inválida ou expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Arena inexistente ou não pertence à conta autenticada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: O horário sobrepõe outro horário aberto na arena
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/arenas/{id}/time-slots/manage:
    get:
      summary: Lista todos os horários para o dono da arena
      description: Inclui horários disponíveis, agendados, em andamento, passados e encerrados.
      operationId: listManagedArenaTimeSlots
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Horários da arena com o jogo relacionado, quando houver
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ManagedTimeSlot'
        '400':
          description: Identificador inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Sessão ausente, inválida ou expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Arena inexistente ou pertencente a outra conta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/arenas/{arenaId}/time-slots/{slotId}/close:
    patch:
      summary: Encerra um horário da arena
      description: O dono pode encerrar horários disponíveis, agendados, em andamento ou passados. A operação é idempotente.
      operationId: closeArenaTimeSlot
      security:
        - cookieAuth: []
      parameters:
        - name: arenaId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: slotId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Horário encerrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeSlot'
        '400':
          description: Identificador inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Sessão ausente, inválida ou expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Horário inexistente ou arena pertencente a outra conta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/arenas/{id}/games:
    get:
      summary: Lista os jogos agendados em uma arena
      operationId: listArenaGames
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Jogos futuros ou em andamento, incluindo os IDs dos participantes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Game'
        '400':
          description: Identificador inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Sessão ausente, inválida ou expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me/games:
    get:
      summary: Lista os jogos futuros ou em andamento da conta autenticada
      description: Retorna jogos em que a conta participa, incluindo os que organizou, enquanto o horário não terminou nem foi encerrado.
      operationId: listMyGames
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Jogos futuros ou em andamento da conta autenticada
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Game'
        '401':
          description: Sessão ausente, inválida ou expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/time-slots/{id}/games:
    post:
      summary: Agenda um jogo em um horário disponível
      description: O organizador entra automaticamente como participante. Um horário aceita um único jogo.
      operationId: scheduleGame
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '201':
          description: Jogo agendado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          description: Identificador inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Sessão ausente, inválida ou expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Horário inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Horário ocupado ou organizador já tem jogo nesse intervalo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/games:
    get:
      summary: Busca jogos futuros ou em andamento disponíveis para a conta autenticada
      description: Retorna jogos ainda não encerrados em que a conta não participa e que não conflitam com seus outros jogos. Jogos cujo horário terminou não aparecem. A data é filtrada pelo dia UTC de início.
      operationId: searchAvailableGames
      security:
        - cookieAuth: []
      parameters:
        - name: city
          in: query
          required: false
          description: Cidade da arena, com correspondência exata sem diferenciar maiúsculas/minúsculas.
          schema:
            type: string
        - name: date
          in: query
          required: false
          description: Dia UTC de início do jogo no formato AAAA-MM-DD.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Jogos disponíveis em ordem cronológica, com resumo da arena
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GameSearchResult'
        '400':
          description: Filtro de data inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Sessão ausente, inválida ou expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/games/{id}:
    get:
      summary: Consulta os detalhes de um jogo
      operationId: getGame
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Detalhes do jogo e seus participantes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          description: Identificador inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Sessão ausente, inválida ou expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Jogo inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/games/{id}/lobby:
    get:
      summary: Consulta o lobby de um jogo
      description: Retorna os dados do jogo, da arena e os nomes dos participantes confirmados.
      operationId: getGameLobby
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Dados do lobby
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameLobby'
        '400':
          description: Identificador inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Sessão ausente, inválida ou expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Jogo inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/games/{id}/participants/me:
    delete:
      summary: Sai do jogo na conta autenticada
      description: Remove a participação atual. A remoção é idempotente; o organizador não pode sair do próprio jogo.
      operationId: leaveGame
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Participação removida ou já ausente
        '400':
          description: Identificador inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Sessão ausente, inválida ou expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Jogo inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: O organizador não pode sair do próprio jogo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/games/{id}/join:
    post:
      summary: Confirma presença em um jogo
      description: Um usuário pode participar de jogos em horários diferentes, sem intervalos sobrepostos.
      operationId: joinGame
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Participação confirmada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          description: Identificador inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Sessão ausente, inválida ou expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Jogo inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Usuário já participa ou possui outro jogo no mesmo intervalo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /uploads/{filename}:
    get:
      summary: Retorna uma foto pública de arena
      operationId: getArenaPhoto
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-f0-9]{32}\.(jpg|png)$'
      responses:
        '200':
          description: Arquivo de imagem
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: Arquivo inexistente
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: onracha_session
  schemas:
    User:
      type: object
      required: [id, name, email, created_at]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Lucas Oliveira
        email:
          type: string
          format: email
          example: lucas@example.com
        created_at:
          type: string
          format: date-time
    Arena:
      type: object
      required: [id, owner_user_id, name, arena_type, address, city, state, latitude, longitude, photo_url, active, created_at]
      properties:
        id:
          type: integer
          format: int64
        owner_user_id:
          type: integer
          format: int64
        name:
          type: string
        arena_type:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
          minLength: 2
          maxLength: 2
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          nullable: true
          example: -23.55052
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          nullable: true
          example: -46.633308
        photo_url:
          type: string
          format: uri
          nullable: true
          readOnly: true
          example: https://images.example.test/arena.png
        active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
    TimeSlot:
      type: object
      required: [id, arena_id, starts_at, ends_at, created_at, closed_at]
      properties:
        id:
          type: integer
          format: int64
        arena_id:
          type: integer
          format: int64
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
          nullable: true
    ManagedTimeSlot:
      allOf:
        - $ref: '#/components/schemas/TimeSlot'
        - type: object
          required: [game_id]
          properties:
            game_id:
              type: integer
              format: int64
              nullable: true
    Game:
      type: object
      required: [id, time_slot_id, arena_id, organizer_user_id, starts_at, ends_at, participant_user_ids, created_at]
      properties:
        id:
          type: integer
          format: int64
        time_slot_id:
          type: integer
          format: int64
        arena_id:
          type: integer
          format: int64
        organizer_user_id:
          type: integer
          format: int64
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        participant_user_ids:
          type: array
          items:
            type: integer
            format: int64
        created_at:
          type: string
          format: date-time
    GameSearchResult:
      type: object
      required: [game, arena]
      properties:
        game:
          $ref: '#/components/schemas/Game'
        arena:
          $ref: '#/components/schemas/ArenaSummary'
    GameLobby:
      type: object
      required: [game, arena, participants]
      properties:
        game:
          $ref: '#/components/schemas/Game'
        arena:
          $ref: '#/components/schemas/ArenaSummary'
        participants:
          type: array
          items:
            $ref: '#/components/schemas/GameParticipant'
    GameParticipant:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    DiscoveredArena:
      type: object
      required: [id, name, arena_type, address, city, state, latitude, longitude, photo_url]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        arena_type:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          nullable: true
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          nullable: true
        photo_url:
          type: string
          format: uri
          nullable: true
    ArenaSummary:
      type: object
      required: [id, name, address, city, state, latitude, longitude, photo_url]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          nullable: true
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          nullable: true
        photo_url:
          type: string
          format: uri
          nullable: true
          readOnly: true
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: invalid_input
            message:
              type: string
              example: Confira nome, email e senha.

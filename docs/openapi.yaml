openapi: 3.1.0
info:
  title: ONRACHA API
  version: 0.1.0
  description: API inicial do ONRACHA com cadastro e autenticação de contas.
servers:
  - url: http://localhost:8080
    description: Ambiente local via Docker Compose
paths:
  /health:
    get:
      summary: Verifica se a API está respondendo
      operationId: healthCheck
      responses:
        '200':
          description: API disponível
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /api/v1/auth/register:
    post:
      summary: Cria uma conta
      operationId: registerAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  minLength: 1
                  example: Lucas Oliveira
                email:
                  type: string
                  format: email
                  maxLength: 254
                  example: lucas@example.com
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                  description: Senha em forma de frase; espaços e caracteres Unicode são aceitos.
      responses:
        '201':
          description: Conta criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email já cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/login:
    post:
      summary: Inicia uma sessão
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: lucas@example.com
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
      responses:
        '200':
          description: Sessão iniciada; token retornado em cookie HttpOnly
          headers:
            Set-Cookie:
              description: Cookie de sessão com validade de 24 horas.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Corpo JSON inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Email ou senha inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/me:
    get:
      summary: Retorna a conta da sessão atual
      operationId: currentAccount
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Conta autenticada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Sessão ausente, inválida ou expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/arenas:
    get:
      summary: Lista as arenas da conta autenticada
      operationId: listArenas
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Arenas da conta, ordenadas da mais recente para a mais antiga
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Arena'
        '401':
          description: Sessão ausente, inválida ou expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Cadastra uma arena para a conta autenticada
      operationId: createArena
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, arena_type, address, city, state]
              properties:
                name:
                  type: string
                  minLength: 1
                  example: Arena Central
                arena_type:
                  type: string
                  minLength: 1
                  description: Tipo é normalizado para letras minúsculas.
                  example: society
                address:
                  type: string
                  minLength: 1
                  example: Rua do Esporte, 100
                city:
                  type: string
                  minLength: 1
                  example: São Paulo
                state:
                  type: string
                  minLength: 2
                  maxLength: 2
                  pattern: '^[A-Za-z]{2}$'
                  description: Sigla da UF; a API normaliza o valor para maiúsculas.
                  example: SP
      responses:
        '201':
          description: Arena cadastrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Arena'
        '400':
          description: Dados inválidos ou campo não permitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Sessão ausente, inválida ou expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/arenas/{id}:
    get:
      summary: Retorna os dados de uma arena da conta autenticada
      operationId: getArena
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Arena encontrada e pertencente à conta autenticada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Arena'
        '400':
          description: Identificador inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Sessão ausente, inválida ou expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Arena inexistente ou pertencente a outra conta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Substitui os dados editáveis de uma arena
      operationId: updateArena
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, arena_type, address, city, state, active]
              properties:
                name:
                  type: string
                  minLength: 1
                arena_type:
                  type: string
                  minLength: 1
                address:
                  type: string
                  minLength: 1
                city:
                  type: string
                  minLength: 1
                state:
                  type: string
                  minLength: 2
                  maxLength: 2
                  pattern: '^[A-Za-z]{2}$'
                active:
                  type: boolean
      responses:
        '200':
          description: Arena atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Arena'
        '400':
          description: Dados incompletos ou inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Sessão ausente, inválida ou expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Arena inexistente ou pertencente a outra conta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/arenas/{id}/active:
    patch:
      summary: Alterna entre ativa e inativa a arena da conta autenticada
      operationId: toggleArenaActive
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Estado de atividade alternado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Arena'
        '400':
          description: Identificador inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Sessão ausente, inválida ou expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Arena inexistente ou pertencente a outra conta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/arenas/{id}/time-slots:
    get:
      summary: Lista horários futuros disponíveis em uma arena
      operationId: listAvailableTimeSlots
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Horários futuros sem jogo agendado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimeSlot'
        '400':
          description: Identificador inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Sessão ausente, inválida ou expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Cadastra um horário na arena
      operationId: createArenaTimeSlot
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [starts_at, ends_at]
              properties:
                starts_at:
                  type: string
                  format: date-time
                  example: '2026-12-12T19:00:00-03:00'
                ends_at:
                  type: string
                  format: date-time
                  example: '2026-12-12T20:00:00-03:00'
      responses:
        '201':
          description: Horário cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeSlot'
        '400':
          description: Intervalo inválido ou no passado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Sessão ausente, inválida ou expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Arena inexistente ou não pertence à conta autenticada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: O horário sobrepõe outro horário cadastrado na arena
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/arenas/{id}/games:
    get:
      summary: Lista os jogos agendados em uma arena
      operationId: listArenaGames
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Jogos em ordem cronológica, incluindo os IDs dos participantes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Game'
        '400':
          description: Identificador inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Sessão ausente, inválida ou expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me/games:
    get:
      summary: Lista os próximos jogos da conta autenticada
      description: Retorna os jogos futuros em que a conta participa, incluindo os jogos que organizou, em ordem cronológica.
      operationId: listMyGames
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Jogos futuros da conta autenticada
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Game'
        '401':
          description: Sessão ausente, inválida ou expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/time-slots/{id}/games:
    post:
      summary: Agenda um jogo em um horário disponível
      description: O organizador entra automaticamente como participante. Um horário aceita um único jogo.
      operationId: scheduleGame
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '201':
          description: Jogo agendado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          description: Identificador inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Sessão ausente, inválida ou expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Horário inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Horário ocupado ou organizador já tem jogo nesse intervalo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/games/{id}/join:
    post:
      summary: Confirma presença em um jogo
      description: Um usuário pode participar de jogos em horários diferentes, sem intervalos sobrepostos.
      operationId: joinGame
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Participação confirmada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          description: Identificador inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Sessão ausente, inválida ou expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Jogo inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Usuário já participa ou possui outro jogo no mesmo intervalo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: onracha_session
  schemas:
    User:
      type: object
      required: [id, name, email, created_at]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Lucas Oliveira
        email:
          type: string
          format: email
          example: lucas@example.com
        created_at:
          type: string
          format: date-time
    Arena:
      type: object
      required: [id, owner_user_id, name, arena_type, address, city, state, active, created_at]
      properties:
        id:
          type: integer
          format: int64
        owner_user_id:
          type: integer
          format: int64
        name:
          type: string
        arena_type:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
          minLength: 2
          maxLength: 2
        active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
    TimeSlot:
      type: object
      required: [id, arena_id, starts_at, ends_at, created_at]
      properties:
        id:
          type: integer
          format: int64
        arena_id:
          type: integer
          format: int64
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    Game:
      type: object
      required: [id, time_slot_id, arena_id, organizer_user_id, starts_at, ends_at, participant_user_ids, created_at]
      properties:
        id:
          type: integer
          format: int64
        time_slot_id:
          type: integer
          format: int64
        arena_id:
          type: integer
          format: int64
        organizer_user_id:
          type: integer
          format: int64
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        participant_user_ids:
          type: array
          items:
            type: integer
            format: int64
        created_at:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: invalid_input
            message:
              type: string
              example: Confira nome, email e senha.

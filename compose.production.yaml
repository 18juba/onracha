name: onracha

services:
  db:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB em .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER em .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD em .env.production}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: backend/migrations.Dockerfile
    image: onracha-migrate:production
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER:?Defina POSTGRES_USER em .env.production}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD em .env.production}@db:5432/${POSTGRES_DB:?Defina POSTGRES_DB em .env.production}?sslmode=disable"
      - up
    depends_on:
      db:
        condition: service_healthy

  photos-init:
    image: alpine:3.24
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command: >-
      if [ ! -f /uploads/.onracha/permissions-initialized ]; then
        chown -R 10001:10001 /uploads;
        mkdir -p /uploads/.onracha;
        chown 10001:10001 /uploads/.onracha;
        touch /uploads/.onracha/permissions-initialized;
        chown 10001:10001 /uploads/.onracha/permissions-initialized;
      fi
    volumes:
      - arena_photos:/uploads

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: onracha-backend:production
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:?Defina POSTGRES_USER em .env.production}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD em .env.production}@db:5432/${POSTGRES_DB:?Defina POSTGRES_DB em .env.production}?sslmode=disable"
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Defina FRONTEND_ORIGIN em .env.production}
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-true}"
      PHOTO_PUBLIC_URL: ${PHOTO_PUBLIC_URL:?Defina PHOTO_PUBLIC_URL em .env.production}
    volumes:
      - arena_photos:/uploads
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      photos-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:?Defina VITE_API_URL em .env.production}
    image: onracha-frontend:production
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-5173}:3000"

volumes:
  postgres_data:
    name: onracha_postgres_data
  arena_photos:
    name: onracha_arena_photos
